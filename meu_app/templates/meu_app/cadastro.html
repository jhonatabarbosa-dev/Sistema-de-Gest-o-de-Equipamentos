<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Equipamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Cadastrar Novo Equipamento</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Nome do Equipamento:</label>
                        {{ form.nome }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Número de Patrimônio:</label>
                        {{ form.numero_patrimonio }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Tipo:</label>
                        {{ form.tipo }}
                    </div>

                    <div class="mb-3 form-check">
                        {{ form.em_uso }}
                        <label class="form-check-label ms-2">Equipamento está em uso?</label>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'lista' %}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Salvar Equipamento</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
