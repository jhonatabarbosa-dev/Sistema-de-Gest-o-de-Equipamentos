<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Equipamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-header bg-info text-white">
                <h4 class="mb-0">Detalhes do Equipamento #{{ equipamento.id }}</h4>
            </div>
            <div class="card-body">
                <ul class="list-group list-group-flush mb-4">
                    <li class="list-group-item"><strong>Nome:</strong> {{ equipamento.nome }}</li>
                    <li class="list-group-item"><strong>Número de Patrimônio:</strong> {{ equipamento.numero_patrimonio }}</li>
                    <li class="list-group-item"><strong>Tipo:</strong> {{ equipamento.tipo }}</li>
                    <li class="list-group-item">
                        <strong>Situação:</strong> 
                        {% if equipamento.em_uso %}
                            <span class="badge bg-success">Em Uso</span>
                        {% else %}
                            <span class="badge bg-secondary">Disponível</span>
                        {% endif %}
                    </li>
                </ul>
                <a href="{% url 'lista' %}" class="btn btn-primary w-100">Voltar para a Lista</a>
            </div>
        </div>
    </div>
</body>
</html>
